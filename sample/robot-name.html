/// <reference path="../global.d.ts" />
export class Robot {
  #name;
  static #nameSet = new Set();

  constructor() {
    this.reset();
  }

  #randomChar(min, max) {
    const minCode = min.charCodeAt(0);
    const maxCode = max.charCodeAt(0);
    const randomCode = minCode + Math.random() * (1 + maxCode - minCode);
    return String.fromCharCode(randomCode);
  }

  get #digit() {
    return this.#randomChar("0", "9");
  }

  get #letter() {
    return this.#randomChar("A", "Z");
  }

  #generateName() {
    const alpha = `${this.#letter}${this.#letter}`;
    const num = `${this.#digit}${this.#digit}${this.#digit}`;
    this.#name = alpha + num;
  }

  reset() {
    do this.#generateName();
    while (Robot.#nameSet.has(this.#name));
    Robot.#nameSet.add(this.#name);
  }

  get name() {
    return this.#name.slice(0);
  }

  static releaseNames() {
    Robot.#nameSet.clear();
  }
}

import {
  afterEach,
  beforeEach,
  describe,
  expect,
  test,
} from '@jest/globals';
import { Robot } from './robot-name';

const areSequential = (name1, name2) => {
  const alpha1 = name1.substring(0, 2);
  const alpha2 = name2.substring(0, 2);
  const num1 = Number(name1.substring(2, 5));
  const num2 = Number(name2.substring(2, 5));

  const numDiff = num2 - num1;
  const alphaDiff =
    (alpha2.charCodeAt(0) - alpha1.charCodeAt(0)) * 26 +
    (alpha2.charCodeAt(1) - alpha1.charCodeAt(1));

  const totalDiff = alphaDiff * 1000 + numDiff;

  return Math.abs(totalDiff) <= 1;
};

const TOTAL_NUMBER_OF_NAMES =
  26 * // A-Z
  26 * // A-Z
  10 * // 0-9
  10 * // 0-9
  10; // 0-9

describe('Robot', () => {
  let robot;

  beforeEach(() => {
    robot = new Robot();
  });
  afterEach(() => {
    Robot.releaseNames();
  });

  test('has a name', () => {
    expect(robot.name).toMatch(/^[A-Z]{2}\d{3}$/);
  });

  test('name is the same each time', () => {
    expect(robot.name).toEqual(robot.name);
  });

  test('different robots have different names', () => {
    const differentRobot = new Robot();
    expect(differentRobot.name).not.toEqual(robot.name);
  });

  test('is able to reset the name', () => {
    const originalName = robot.name;

    robot.reset();
    const newName = robot.name;

    expect(newName).toMatch(/^[A-Z]{2}\d{3}$/);
    expect(originalName).not.toEqual(newName);
  });

  test('should set a unique name after reset', () => {
    const NUMBER_OF_ROBOTS = 10000;
    const usedNames = new Set();

    usedNames.add(robot.name);
    for (let i = 0; i < NUMBER_OF_ROBOTS; i += 1) {
      robot.reset();
      usedNames.add(robot.name);
    }

    expect(usedNames.size).toEqual(NUMBER_OF_ROBOTS + 1);
  });

  test('internal name cannot be modified', () => {
    const modifyInternal = () => {
      robot.name += 'a modification';
    };
    expect(() => modifyInternal()).toThrow();
  });

  test('new names should not be sequential', () => {
    const name1 = robot.name;
    const name2 = new Robot().name;
    const name3 = new Robot().name;
    expect(areSequential(name1, name1)).toBe(true);
    expect(areSequential(name1, name2)).toBe(false);
    expect(areSequential(name2, name3)).toBe(false);
  });

  test('names from reset should not be sequential', () => {
    const name1 = robot.name;
    robot.reset();
    const name2 = robot.name;
    robot.reset();
    const name3 = robot.name;
    expect(areSequential(name1, name2)).toBe(false);
    expect(areSequential(name2, name3)).toBe(false);
    expect(areSequential(name3, name3)).toBe(true);
  });
});

<script type="module">
  import { runTests } from "./imported.mjs";

  let abortController;

  function onRunTests(event) {
    event.preventDefault();

    if (abortController) {
      abortController.abort("Another run was requested");
    }

    abortController = new AbortController();

    const form = event.currentTarget;
    const slug = form.querySelector('input[name="slug"]').value;

    const fileInputs = form.querySelectorAll('textarea[name^="files["]');
    const files = {};
    fileInputs.forEach((file) => {
      const filePath = file
        .getAttribute("name")
        .replace(/^files\[/, "")
        .replace(/\]$/, "");
      files[filePath] = file.value;
    });

    const output = document.getElementById("output");
    output.textContent = null;

    runTests(slug, files, ["robot-name.js"], abortController.signal).then(
      (result) => (output.textContent = JSON.stringify(result, null, 2)),
    );
  }

  const form = document.getElementById("form");
  form.addEventListener("submit", onRunTests);
</script>
